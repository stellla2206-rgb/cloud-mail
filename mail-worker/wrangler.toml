name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "cloud-mail"
database_id = "4a3f181d-6059-4515-9f01-d6c6cf22a8c1"

[[kv_namespaces]]
binding = "KV"
id = "3e93467b0fe44673a45bc44277472eda"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["frouronne.website"]
admin = "admin@frouronne.website"
jwt_secret = "c9a7f3e8b2d14a6c9e8f1a2b3c4d5e6f7a8b9c0d"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
